<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>フィラメント登録テスト</title>
</head>

<body>

  <h2>フィラメント登録テスト</h2>

  <p>
    管理番号：
    <input id="id" value="QR-TEST-002">
  </p>

  <p>
    メーカー：
    <input id="maker" value="テストメーカー">
  </p>

  <p>
    母材：
    <input id="base" value="PLA">
  </p>

  <p>
    サブカテゴリ：
    <input id="sub" value="PLA Matte">
  </p>

  <p>
    色：
    <input id="color" value="白">
  </p>

  <p>
    保管場所：
    <input id="location" value="テスト棚">
  </p>

  <p>
    重量：
    <input id="weight" type="number" value="1000"> g
  </p>

  <p>
    担当：
    <input id="person" value="テスト">
  </p>

  <p>
    備考：
    <input id="note" value="QR API登録テスト">
  </p>


  <button id="registerButton">
    新規登録
  </button>

  <hr>

  <p id="result">
    未送信
  </p>


<script>

// ★ここだけ自分のGAS URLに変更してください
const GAS_URL =
  "https://script.google.com/macros/s/AKfycbzCCejDFlAfJV5sjxhzH7wp1-4S7oVK6s0Gru_m4QXVmSRdnnOXDcCfqeogW5GA4PFR/exec";


document
  .getElementById("registerButton")
  .addEventListener("click", async () => {

    const result =
      document.getElementById("result");

    result.textContent = "送信中...";


    // 入力欄から値を取得
    const data = {

      action: "register",

      id:
        document.getElementById("id").value,

      maker:
        document.getElementById("maker").value,

      base:
        document.getElementById("base").value,

      sub:
        document.getElementById("sub").value,

      color:
        document.getElementById("color").value,

      location:
        document.getElementById("location").value,

      weight:
        Number(
          document.getElementById("weight").value
        ),

      person:
        document.getElementById("person").value,

      note:
        document.getElementById("note").value
    };


    try {

      const response = await fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify(data)
      });


      const responseData =
        await response.json();


      if (responseData.ok) {

        result.textContent =
          "登録成功！ 管理番号：" +
          responseData.id;

      } else {

        result.textContent =
          "GASエラー：" +
          responseData.error;

      }


    } catch (error) {

      result.textContent =
        "通信エラー：" +
        error.message;
    }

  });

</script>

</body>
</html>
